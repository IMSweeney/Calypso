[package]
edition      = "2021"
name         = "calypso-core"
rust-version = "1.88"
version      = "0.1.0"
description  = "Platform-independent logic for the Calypso firmware; unit-testable on the host."

[dependencies]
# trouble-host is no_std and platform-independent: the GATT attribute table is
# built here so host tests can poke at it exactly like a BLE client would.
trouble-host = { version = "0.5.0", features = ["gatt"] }
# `#[gatt_server]`/`#[gatt_service]` back each characteristic with a
# `static_cell::StaticCell`, which is the table's storage. See src/gatt.rs.
static_cell = "2.1.1"
embassy-sync = "0.7.2"
embedded-storage = "0.3.1"
# no_std math (sqrt/atan2/asin) for the rep trace integration.
libm = "0.2"
# Protobuf wire format for rep records and BLE sync (proto/calypso.proto).
# heapless containers keep the generated types allocation-free.
micropb = { version = "0.6.0", features = ["container-heapless-0-9"] }
heapless = "0.9"
# The chunked pipe's framing and its two state machines, which both
# characteristics now carry (`src/pipe.rs`). A crate of its own because it is a
# protocol rather than Calypso: the app has a mirror of it, and the two are
# checked against the same vectors.
gatt-pipe = { path = "../tools/gatt-pipe" }

[build-dependencies]
micropb-gen = "0.6.0"
# Prebuilt protoc, so no system install (or CI setup) is needed.
protoc-bin-vendored = "3"

[dev-dependencies]
# used by the synthetic fixture generators in tests/
libm = "0.2"
# `tests/pipe.rs` drives the device's session against the pipe's own app-side
# state machine, rather than against a radio.
gatt-pipe = { path = "../tools/gatt-pipe" }
# For `tests/gatt_generated.rs`, which regenerates the table in memory and
# compares it with the committed `src/gatt.rs`. Published separately: this crate
# consumes it, it does not own it.
gatt-gen = { path = "../tools/gatt-gen" }
