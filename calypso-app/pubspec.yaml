name: calypso
description: Calypso client — sync reps from the device, list summaries, plot a rep in 3D.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  # Wire format, generated from proto/calypso.proto (see tool/gen_proto.sh).
  protobuf: ^6.1.0
  # BLE: BSD-3 (Navideck), one API across Android/iOS/macOS/Windows/Linux/Web.
  # Chosen over flutter_reactive_ble (Android/iOS only) so the BLE path can be
  # developed on the Mac, where CoreBluetooth exists. (flutter_blue_plus is
  # nicer but needs a paid licence for for-profit use since 2.0, including
  # development.)
  universal_ble: ^2.3.0
  # 3D maths for the plot model (projection, camera).
  vector_math: ^2.1.4
  provider: ^6.1.2
  # Where the history file lives (iOS application support directory).
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/fixtures/
