// A device whose two characteristics are a pipe: one transfer carries one
// message, however big, instead of one value.
//
// The shape is what SPEC.md calls a pipe: a written characteristic and a notified
// one, sharing a name, with no `max_len` — a pipe sizes its transfers, not its
// values.

syntax = "proto3";

package bulk;

import "gatt_options.proto";
import "google/protobuf/empty.proto";

message Command {
  uint32 id = 1;
  bytes payload = 2;
}

message Event {
  uint32 id = 1;
  bytes payload = 2;
}

service Bulk {
  option (gatt.service) = {
    uuid: "e3a20001-1f2c-4a5b-9d3e-8c7f6a5b4c3d"
    primary: true
  };

  // Written by the central: `WRITE_NO_RSP`, because the pipe acknowledges with
  // its own chunks.
  rpc Down(Command) returns (google.protobuf.Empty) {
    option (gatt.characteristic) = {
      uuid: "e3a20002-1f2c-4a5b-9d3e-8c7f6a5b4c3d"
      props: [WRITE_NO_RSP]
      pipe: "bulk"
    };
  }

  // Notified by the peripheral.
  rpc Up(google.protobuf.Empty) returns (Event) {
    option (gatt.characteristic) = {
      uuid: "e3a20003-1f2c-4a5b-9d3e-8c7f6a5b4c3d"
      props: [NOTIFY]
      pipe: "bulk"
    };
  }
}
