// The vocabulary for describing a BLE GATT table in proto.
//
// A `service` carrying `option (gatt.service)` is a GATT service; an `rpc`
// carrying `option (gatt.characteristic)` is one characteristic. The request
// type is what the central writes, the response type is what the peripheral
// reads or notifies. `google.protobuf.Empty` means nothing travels that way.
//
// This file is the schema's only vocabulary: it is imported by the product
// protos and read back out of the descriptor set by `tools/gatt-gen`.

syntax = "proto3";

package gatt;

import "google/protobuf/descriptor.proto";

enum Prop {
  PROP_UNSPECIFIED = 0;
  READ = 1;
  WRITE = 2;
  WRITE_NO_RSP = 3;
  NOTIFY = 4;
  INDICATE = 5;
}

// A link security requirement. Nothing in the current device stack enforces
// these per characteristic, so the generator warns when one is set rather than
// emitting code that pretends (see tools/gatt-gen/PLAN.md).
enum Perm {
  PERM_NONE = 0;
  PERM_ENCRYPTED = 1;
  PERM_AUTHENTICATED = 2;
}

message ServiceOpts {
  string uuid = 1; // canonical 128-bit string
  bool primary = 2;
}

message CharOpts {
  string uuid = 1;
  repeated Prop props = 2;
  Perm perm = 3;
  // Bounded size for a single-shot characteristic. Required for gatt.Utf8 and
  // gatt.Bytes, and for a protobuf message that is not part of a pipe.
  uint32 max_len = 4;
  // Pairs the written and the notified characteristic of one chunked pipe.
  string pipe = 5;
  // Names a codec the user supplies instead of a generated one.
  string custom_codec = 6;
  // Optional numeric ceiling for a bare integer.
  uint32 max = 7;
}

extend google.protobuf.ServiceOptions { ServiceOpts service = 50001; }
extend google.protobuf.MethodOptions { CharOpts characteristic = 50002; }

// Bare-value markers: never serialized as protobuf. The generator maps each to
// a fixed raw little-endian encoding, so these are byte-compatible with the
// SIG-standard characteristics they stand in for. The `value` field exists only
// so the file is valid protobuf.
message U8    { uint32 value = 1; }  // 1 byte
message U16   { uint32 value = 1; }  // 2 bytes
message U32   { uint32 value = 1; }  // 4 bytes
message I8    { int32  value = 1; }
message I16   { int32  value = 1; }
message I32   { int32  value = 1; }
message F32   { float  value = 1; }
message Bool  { bool   value = 1; }  // 1 byte, 0 or 1
message Utf8  { string value = 1; }  // requires max_len
message Bytes { bytes  value = 1; }  // requires max_len
