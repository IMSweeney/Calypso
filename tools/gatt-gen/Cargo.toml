[package]
authors      = ["Ian Sweeney"]
categories   = ["development-tools::build-utils", "embedded", "encoding"]
description  = "Generates type-checked GATT code for both ends of a BLE link from proto-defined services."
edition      = "2021"
keywords     = ["ble", "bluetooth", "gatt", "protobuf", "codegen"]
license      = "Apache-2.0"
name         = "gatt-gen"
readme       = "README.md"
repository   = "https://github.com/IMSweeney/gatt-gen"
rust-version = "1.88"
version      = "0.1.0"

# The example is a member so that `cargo test` here builds it: an example that is
# never built is an example that is wrong.
[workspace]
members = ["examples/server", "examples/pipe"]

[dependencies]
# Reads the descriptor set protoc produces, including the custom options
# (`gatt.service` / `gatt.characteristic`) that carry the GATT schema.
prost-reflect = "0.16"
# Prebuilt protoc, so the generator needs no system install.
protoc-bin-vendored = "3"
