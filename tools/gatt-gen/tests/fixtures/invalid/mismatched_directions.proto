syntax = "proto3";

package fixture;

import "gatt_options.proto";
import "google/protobuf/empty.proto";

message Command { uint32 id = 1; }
message Reading { uint32 value = 1; }

service S {
  option (gatt.service) = { uuid: "0000180f-0000-1000-8000-00805f9b34fb" primary: true };
  rpc C(Command) returns (Reading) {
    option (gatt.characteristic) = { uuid: "00002a19-0000-1000-8000-00805f9b34fb" props: [READ, WRITE] max_len: 16 };
  }
}
