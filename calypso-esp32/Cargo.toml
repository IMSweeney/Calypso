[package]
edition      = "2024"
name         = "calypso-esp32"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "calypso"
path = "./src/bin/main.rs"

[dependencies]
heapless = "0.9"
esp-hal = { version = "~1.0", features = ["defmt", "esp32", "unstable"] }

esp-rtos = { version = "0.2.0", features = [
  "defmt",
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32",
] }

defmt                  = "1.0.1"
esp-bootloader-esp-idf = { version = "0.4.0", features = ["defmt", "esp32"] }

esp-alloc = { version = "0.9.0", features = ["defmt"] }
esp-println = { version = "0.16.1", features = [
  "defmt-espflash",
  "esp32",
  # Millisecond timestamps on every line; the symbol it calls is in `main.rs`.
  "timestamp",
] }
# for more networking protocol support see https://crates.io/crates/edge-net
bt-hci = "0.6.0"
embassy-executor = { version = "0.9.1", features = ["defmt"] }
embassy-futures = "0.1.1"
embassy-sync = "0.7.2"
embassy-time = { version = "0.5.0", features = ["defmt"] }
# BLE only. The radio also does Wi-Fi on this chip, and nothing here initialises
# it, so `wifi` (the driver and its network stack) and `smoltcp` stay out.
#
# `coex` is not a "more is safer" flag: it arbitrates between the two radios, and
# esp-radio only compiles it in when both are enabled — with no Wi-Fi it is a build
# warning and nothing else.
#
# `unstable` is not optional: esp-radio refuses `ble` without it. `esp-alloc` is
# the heap the controller allocates from. `defmt` and `esp32` are this build's.
esp-radio = { version = "0.17.0", features = [
  "ble",
  "defmt",
  "esp-alloc",
  "esp32",
  "unstable",
] }
trouble-host = { version = "0.5.0", features = ["gatt"] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
bno055 = "0.4.0"
# `defmt` so a flash failure can name itself: `FlashStorageError` is the difference
# between the flash *refusing* an operation (`OtherCoreRunning`) and failing one
# (`IoTimeout`, `IoError`), and a message that hides it costs a session (see
# docs/GOTCHAS.md, "Rep log unusable").
esp-storage = { version = "0.8.1", features = ["esp32", "defmt"] }
embedded-storage = "0.3.1"
calypso-core = { path = "../calypso-core" }

[features]
# Store a synthetic "rep" every 30 s instead of detecting real ones, so the whole
# device -> flash log -> BLE -> app path can be exercised on a bench with nobody
# lifting. A build flag rather than a runtime setting on purpose: a device must not
# be one accidental setting away from recording fiction as if it were a set.
#
#   cargo run --features fake-reps
#
fake-reps = []

# Record raw sample windows on a timer and store them as if they were reps, running no
# detector and no travel check, so a session that stores nothing still leaves the samples
# it was made of. The filter runs — its offsets and attitude are half of what a capture is
# for — and every window is marked with detector version 0, because none closed it.
#
#   cargo run --release --features record-mode
#
record-mode = []

[profile.dev.package.esp-storage]
opt-level = 3

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
