[package]
edition      = "2024"
name         = "calypso-esp32"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "calypso"
path = "./src/bin/main.rs"

[dependencies]
heapless = "0.9"
esp-hal = { version = "~1.0", features = ["defmt", "esp32", "unstable"] }

esp-rtos = { version = "0.2.0", features = [
  "defmt",
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32",
] }

defmt                  = "1.0.1"
esp-bootloader-esp-idf = { version = "0.4.0", features = ["defmt", "esp32"] }

embassy-net = { version = "0.7.1", features = [
  "defmt",
  "dhcpv4",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = { version = "0.7.1", features = ["defmt"] }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
esp-alloc = { version = "0.9.0", features = ["defmt"] }
esp-println = { version = "0.16.1", features = ["defmt-espflash", "esp32"] }
# for more networking protocol support see https://crates.io/crates/edge-net
bt-hci = "0.6.0"
embassy-executor = { version = "0.9.1", features = ["defmt"] }
embassy-futures = "0.1.1"
embassy-sync = "0.7.2"
embassy-time = { version = "0.5.0", features = ["defmt"] }
esp-radio = { version = "0.17.0", features = [
  "ble",
  "coex",
  "defmt",
  "esp-alloc",
  "esp32",
  "smoltcp",
  "unstable",
  "wifi",
] }
smoltcp = { version = "0.12.0", default-features = false, features = [
  "defmt",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }
trouble-host = { version = "0.5.0", features = ["gatt"] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
bno055 = "0.4.0"
# `defmt` so a flash failure can name itself: `FlashStorageError` is the difference
# between the flash *refusing* an operation (`OtherCoreRunning`) and failing one
# (`IoTimeout`, `IoError`), and a message that hides it costs a session (see
# docs/GOTCHAS.md, "Rep log unusable").
esp-storage = { version = "0.8.1", features = ["esp32", "defmt"] }
embedded-storage = "0.3.1"
calypso-core = { path = "../calypso-core" }

[features]
# Store a synthetic "rep" every 10 s instead of detecting real ones, so the whole
# device -> flash log -> BLE -> app path can be exercised on a bench with nobody
# lifting. A build flag rather than a runtime setting on purpose: a device must not
# be one accidental setting away from recording fiction as if it were a set.
#
#   cargo run --features fake-reps
#
fake-reps = []

[profile.dev.package.esp-storage]
opt-level = 3

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
