// The BLE GATT table the device serves, described the way `tools/gatt-gen` reads it: a `service` is a GATT service, an `rpc` is a characteristic, the request type is what the central writes and the response type is what the peripheral reads or notifies.
//
// Separate from `calypso.proto`, which holds the messages: that file is the wire format both sides encode, while this one is the device's table. The device generates its attribute table from this file and the app its typed client, so the UUIDs, the directions and the pipe's shape are declared once.
// Both generated files are committed and nothing regenerates or checks them: run `calypso-core/tool/gen_gatt.sh` and `calypso-app/tool/gen_gatt.sh` after changing this file, and commit both results.

syntax = "proto3";

package calypso;

import "calypso.proto";
import "gatt_options.proto";
import "google/protobuf/empty.proto";

// --- The table -------------------------------------------------------------
//
// The generated Rust lands in `calypso_core::gatt`, the generated Dart in `calypso-app/lib/gatt/gatt_client.dart`.
//
// The two pipe characteristics belong to one **pipe** (`pipe: "sync"`): neither carries a whole message in one value. A message is cut into chunks, each framed and carried in one write or one notification, and reassembled at the other end — `tools/gatt-gen/SPEC.md` §7 describes the protocol, and `tools/gatt-pipe` is the runtime both ends drive it with. That is what a trace travels as: one `TraceChunk` per transfer, a few notifications each, instead of the device re-cutting a trace into three-point notifications. The size of a chunk and of a message are the generator's (`tool/gen_gatt.sh`), not this file's: a pipe has no `max_len`, because it sizes transfers rather than values.
//
// The other two characteristics carry **values**, not transfers: the clock the app writes (`max_len` is what a single write carries), and the device's own faults, which are pushed.
// A state has no event to be pushed on, and a push would have to be sent whenever it might have changed — which on a pipe that carries one message at a time means it competes with the summaries.
//
// Anything the app *does* rather than reads goes on the pipe as an arm of `SyncRequest` (`DevMode`), so the table does not grow a characteristic per operation.
//
// The faults are the exception that proves it: they *are* events, so they are pushed, and they carry one small value because an event the sender has to be paced through is one that can be lost behind the very transfer it is reporting (`Report`).

service Sync {
  option (gatt.service) = {
    uuid: "0000ca20-b0cd-11ec-871f-d45ddf138840"
    primary: true
  };

  // What went wrong, as it happens. `NOTIFY` only: a fault is an event, so no client reads a latest one back — the device sends what it raised while nobody was listening when a subscriber appears, and the kind is all the app gets.
  //
  // `max_len` 20 is the payload every stack guarantees, which is far more than this needs: a `Report` is one enum field, so it encodes to two bytes and `SyncReportsValue::encode` cannot fail. **A value rather than a pipe transfer**, because a fault that had to take its turn behind a trace would be the one thing the app most needs and least gets — and the pipe's own failures are among the faults (see `Report`).
  rpc Reports(google.protobuf.Empty) returns (Report) {
    option (gatt.characteristic) = {
      uuid: "0000ca25-b0cd-11ec-871f-d45ddf138840"
      props: [NOTIFY]
      max_len: 20
    };
  }

  // The device's clock, which the app sets. Unix seconds.
  //
  // Four bytes cannot hold milliseconds, and a second is the precision a phone's clock can honestly claim — the rep times the device derives from this are milliseconds (`RepSummary.t_unix_ms`), so two reps in the same second still order exactly. There is a floor on what the device will believe, and a value below it is ignored rather than stored (see `calypso_core::clock`).
  //
  // `WRITE` rather than `WRITE_NO_RSP`: the app sets this once per boot and is entitled to know whether it landed. Written every time the app connects, because the device's clock lasts exactly one boot.
  rpc Time(gatt.U32) returns (google.protobuf.Empty) {
    option (gatt.characteristic) = {
      uuid: "0000ca23-b0cd-11ec-871f-d45ddf138840"
      props: [WRITE]
    };
  }

  // Everything the app sends: a `SyncRequest`, as chunks the pipe reassembles.
  //
  // `WRITE_NO_RSP` only: the pipe acknowledges with frames of its own, so a write that waits for an ATT response would put the app's next chunk behind a round trip for no signal it does not already have.
  rpc Requests(SyncRequest) returns (google.protobuf.Empty) {
    option (gatt.characteristic) = {
      uuid: "0000ca22-b0cd-11ec-871f-d45ddf138840"
      props: [WRITE_NO_RSP]
      pipe: "sync"
    };
  }

  // Everything the device sends: a `SyncMessage`, as chunks. Summaries stream to a subscriber; trace chunks answer a request.
  //
  // One characteristic, so the frame that carries an acknowledgement travels beside the chunks it is about rather than on a third characteristic of its own.
  rpc Messages(google.protobuf.Empty) returns (SyncMessage) {
    option (gatt.characteristic) = {
      uuid: "0000ca21-b0cd-11ec-871f-d45ddf138840"
      props: [NOTIFY]
      pipe: "sync"
    };
  }
}
