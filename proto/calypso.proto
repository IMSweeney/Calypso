// Calypso wire format: rep records stored in the device flash log, and the
// BLE sync protocol between the device and the phone app.
//
// This file is the single source of truth for both sides. The device builds
// Rust types from it with `micropb` (see `calypso-core/build.rs`); the app
// generates its own classes from the same file.
// The device's types are built from this file on every build, so they cannot go stale; the app's Dart classes are committed, so re-run `calypso-app/tool/gen_proto.sh` and commit them after changing this file.
//
// Fixed-point scales (see `calypso_core::sampler`):
//   - accel: 0.01 m/s^2 per LSB (BNO055 native)
//   - quat:  1/2^14 per LSB, order [w, x, y, z] (BNO055 native)
// Positions/velocities are metres and metres per second (float).
//
// Storage layout: each rep is one `RepSummary` record followed by
// `summary.chunk_count` `TraceChunk` records carrying the same `rep_uuid`, and a
// boot's clock is a `BootClock` record between them.
//
// Rep identity is a **v4 UUID, minted on the device when the rep closes**. It is
// random rather than a counter or a timestamp because a rep can be recorded
// before the client has ever set the device's clock, so an identity derived from
// time would have to have a second form for those; and because random ids need no
// coordination between devices. The price is that UUIDs do not sort — a rep's
// place in time comes from `RepSummary.t_unix_ms` instead.

syntax = "proto3";

package calypso;

// One point of a stored rep trace.
//
// Both the derived displacement and the raw inputs are kept, so the app can
// re-derive traces with better algorithms later without a firmware update.
message TraceSample {
  uint32 t_offset_ms = 1;  // ms from the rep's first trace point
  float px = 2;
  float py = 3;
  float pz = 4;  // ZUPT-anchored displacement from the rep start (m)
  sint32 ax = 5;
  sint32 ay = 6;
  sint32 az = 7;  // raw linear acceleration
  sint32 qw = 8;
  sint32 qx = 9;
  sint32 qy = 10;
  sint32 qz = 11;  // raw orientation quaternion
}

// Summary statistics for one rep. Angles are degrees, distances metres.
message RepSummary {
  bytes rep_uuid = 1;  // 16-byte v4 UUID, minted when the rep closed
  uint32 t_start_ms = 2;
  uint32 t_end_ms = 3;
  uint32 duration_ms = 4;
  // Peak-to-peak vertical travel: the range of motion, on Z. Z is the axis the
  // fusion pins to gravity; X and Y are the mount's heading and drift with yaw,
  // so the largest excursion is not the rep's range of motion and may be the
  // estimate's error rather than the bar.
  float rom = 5;
  float peak_velocity = 6;
  float mean_velocity = 7;
  float peak_accel = 8;
  float roll_min_deg = 9;
  float roll_max_deg = 10;
  float pitch_min_deg = 11;
  float pitch_max_deg = 12;
  uint32 trace_len = 13;    // trace points stored across all chunks
  uint32 chunk_count = 14;  // TraceChunk records following this summary
  // One bit per fact about this rep, so a summary can grow one without paying
  // a tag and a byte for each bool (`REP_FLAG_*` in `calypso_core::rep`):
  //
  //   bit 0  DECIMATED   the trace was decimated to fit device memory
  //   bit 1  CALIBRATED  the IMU's accelerometer was calibrated as well as its
  //                      gyroscope when the rep was recorded
  //   bit 2  HAS_ORIGIN  the summary names the bar's velocity at the rep's
  //                      left edge (field 17), rather than leaving the app to
  //                      assume it started at rest
  //
  // Field 15 was `bool decimated` before this. A bool is a varint too, so a
  // record written then still reads back here: bit 0 is the bit that bool was.
  //
  // CALIBRATED is the fact the recording gate does not require. A rep is
  // recorded whenever the gyroscope is calibrated, because its drift is what
  // fabricates motion; the accelerometer's status wanders on its own, so a rep
  // taken while it was low is still a real rep, recorded with this bit clear.
  uint32 flags = 15;
  // The bar's velocity (m/s) at the rep's left edge, `MARGIN_MS` before motion
  // was declared. A rep mid-set starts already moving, and an integration that
  // assumes zero there reads its travel high. Present only when
  // `REP_FLAG_HAS_ORIGIN` is set, so a record written before this field existed
  // (no origin) is not read as a rep that started at rest.
  TraceOrigin v0 = 17;
  // The rep's wall-clock time, unix milliseconds, or 0 when the device had no
  // clock for the boot that recorded it.
  //
  // **Set when a summary is streamed, 0 in the log.** The time is a property of
  // the boot, not of the rep, and it is often not known until after the rep has
  // been written: a stored summary therefore carries its uptime (`t_start_ms`)
  // and the boot's clock travels as its own record (`BootClock`).
  uint64 t_unix_ms = 16;
}

// The bar's velocity at one instant, metres per second: a rep's left edge.
message TraceOrigin {
  float vx = 1;
  float vy = 2;
  float vz = 3;
}

// The IMU as the sampler last read it: the sample the rep detector is fed.
//
// Read, never notified, and a snapshot rather than a stream: the device republishes it
// ten times a second, so a client that wants to watch the sensor polls it.
// Fixed point at the same scales a `TraceSample` uses, so a readout can be compared with
// what a stored trace carries for the same moment.
message ImuState {
  // When the sampler read it, ms since boot. Read against a client's own idea of when the
  // read was issued: a value that stops moving while the rep log keeps growing is a
  // stalled sampler.
  uint32 t_uptime_ms = 1;
  // Linear acceleration (gravity removed), body frame: 0.01 m/s^2 per LSB.
  sint32 ax = 2;
  sint32 ay = 3;
  sint32 az = 4;
  // Orientation: 1/2^14 per LSB, order [w, x, y, z], as `TraceSample` carries it.
  sint32 qw = 5;
  sint32 qx = 6;
  sint32 qy = 7;
  sint32 qz = 8;
}

// A slice of a rep's trace: as stored in the log, and as sent over BLE.
message TraceChunk {
  bytes rep_uuid = 1;
  uint32 index = 2;              // 0-based chunk index
  uint32 first_t_offset_ms = 3;  // t_offset_ms of the first sample
  repeated TraceSample samples = 4;
  // Chunks in the stream this record belongs to. Set only when a trace is being
  // streamed over BLE; a record stored in the log leaves it 0, because there the
  // summary's chunk_count already describes the trace and the device re-chunks
  // to fit the MTU when streaming. Without this the client cannot tell "more
  // chunks are coming" from "the device has forgotten this rep and will stay
  // silent".
  uint32 total_chunks = 5;
}

// The device's clock, as of one point in the log: what its uptime zero was worth
// on the wall clock from here on.
//
// The device has no RTC, so the only time it can know is the one the client set
// (`Time`, `proto/calypso_gatt.proto`). That time belongs in the log rather than
// in RAM because it outlives the boot: reps written while the client was
// connected keep their time when the device restarts, and a rep that only the RAM
// remembers a clock for would lose it.
//
// Written at most twice per boot:
//   - at mount, with `epoch_s` 0 — a boot's records start here, which is what
//     stops a boot that never had a clock from being read as the one before it;
//   - when the client sets the clock, with the epoch. Re-setting it writes another,
//     and the newest one before a record is the one that dates it.
//
// A record's clock is the newest `BootClock` **at or before it**, which is the
// only rule both ends can apply: the device can name its own boot's records by
// the ids it has in RAM, and a dump of the log carries no ids at all
// (`docs/FIXTURES.md`), so a reader goes by order.
message BootClock {
  uint32 epoch_s = 1; // unix seconds at that boot's uptime zero; 0 = not known
}

// One log record: a rep summary, one of its trace chunks, or a clock reading.
// Keeping them under one wire type makes the log a single self-describing
// stream.
message RepRecord {
  oneof body {
    RepSummary summary = 1;
    TraceChunk trace = 2;
    BootClock clock = 3;
  }
}

// --- BLE sync -------------------------------------------------------------
//
// Two characteristics carry this protocol, one in each direction: `requests`
// (app -> device, a `SyncRequest`) and `messages` (device -> app, a
// `SyncMessage`). One of each, so a new operation is a new arm of these oneofs
// rather than a new characteristic and a new UUID.
//
// Setting the clock is deliberately *not* an arm of `SyncRequest`. It is a state
// the app writes once per boot, like the calibration a client reads, and on the
// pipe it would queue behind the summaries it is meant to be there for — the
// device holds them until it has a clock (see `BootClock`).

// Sent by the app to request a rep's trace. `chunk_index` is ignored unless
// `all_chunks` is false.
message TraceRequest {
  bytes rep_uuid = 1;
  bool all_chunks = 2;
  uint32 chunk_index = 3;
}

// Everything sent app -> device on the sync service.
message SyncRequest {
  oneof body {
    TraceRequest trace = 1;  // answered by `SyncMessage.trace`, in chunks
  }
}

// Everything sent device -> app on the sync service, on the pipe.
//
// A response and a push look alike here, and the client tells them apart by the
// body: a `trace` belongs to the `TraceRequest` that asked for it (its chunks
// carry the rep's UUID), while `summary` arrives because the client subscribed,
// not because it asked.
//
// Calibration is **not** here: it is a state, and the app reads it off its own
// characteristic (`proto/calypso_gatt.proto`) when its UI wants it, rather than
// being sent it at the device's choice of moment.
message SyncMessage {
  oneof body {
    RepSummary summary = 1;  // auto-streamed as reps are recorded
    TraceChunk trace = 2;    // on demand, in response to TraceRequest
    SyncStatus status = 3;
  }
}

// The IMU's calibration state, as the BNO055 reports it in CALIB_STAT (0x35):
// one 0..3 level per sensor, 3 meaning fully calibrated.
//
// The device has no display, so this is what the app turns into a hint. **Rep
// tracking needs `accel` and `gyro` at 3**, and the device will not record a rep
// until they are — an uncalibrated IMU reports drift as motion, so a stored trace
// would be fiction. In the meantime BLE stays up: the app can connect, watch the
// levels climb and tell the user what to do.
//
// `sys` is reported for a console, and is **not** part of readiness: it is the
// chip's aggregate, it counts the magnetometer, and in IMU mode it sits at 0 for
// ever however well the other two are calibrated. Gating on it is a device that
// never records a rep (see `calypso_core::calibration`).
//
// `mag` is reported for completeness only. The BNO055 runs in IMU mode (no
// magnetometer, which is unreliable next to a barbell), where the magnetometer
// never calibrates, so it is never the thing being waited for and the app must
// not send the user chasing it.
//
// Travels as the value of the `Calibration` characteristic
// (`proto/calypso_gatt.proto`), which the client reads: how often the levels are
// looked at is the app's UI's business, not the device's.
message CalibrationStatus {
  uint32 sys = 1;    // 0..3, the aggregate the fusion uses (0 for ever in IMU mode)
  uint32 accel = 2;  // 0..3
  uint32 gyro = 3;   // 0..3
  uint32 mag = 4;    // 0..3, unused in IMU mode
  // True when the device will record reps. Sent rather than derived so the app
  // cannot disagree with the device about whether a rep is being recorded.
  bool ready = 5;
}

message SyncStatus {
  uint32 rep_count = 1;         // reps currently in the log ring
  bytes oldest_rep_uuid = 2;    // reps fall off the ring when it wraps
  bytes newest_rep_uuid = 3;
  bool trace_unavailable = 4;  // requested trace has been overwritten
}

// --- Diagnostics ----------------------------------------------------------

// What the device says when something goes wrong, pushed on the `Reports`
// characteristic (`proto/calypso_gatt.proto`).
//
// **A kind and nothing else.** The device's own sentence stays in its console
// log; the app turns the kind into words. Text was the other shape considered
// and it loses: a sentence long enough to be useful does not fit the payload
// every link can carry, so it would have to be truncated to whatever the
// current link takes, and a sentence that differs by link is one the app cannot
// label, count or recognise. The detail underneath a kind (which flash error,
// which rep) is what a serial console is for.
//
// These are **events, not state**, which is why the characteristic is
// notify-only: a fault is reported when it happens, there is no "and it is fine
// now", and nothing reads a latest one back — a latch the device has to call
// current is a state it cannot know. A client that was not subscribed hears
// nothing, so the device holds what it raised while nobody was listening and
// sends it when a subscriber appears.
//
// The app owns every sentence, so a kind names a **class** of failure and not
// an incident: adding detail on the device side must not change which kind it
// reports. The app counts what arrives.
message Report {
  ReportKind kind = 1;
}

// The classes of failure that reach the phone. Each is something a person
// holding the phone can act on, or can at least be told about in a sentence;
// the firmware's own log has the rest.
enum ReportKind {
  REPORT_KIND_UNSPECIFIED = 0;
  // The rep log did not mount, or could not be read: nothing this boot is
  // stored, and nothing will ever be offered to sync. A bad partition table or
  // a flash that will not answer leaves this device a sensor with no record
  // (docs/GOTCHAS.md).
  REPORT_KIND_LOG_UNUSABLE = 1;
  // A rep closed and could not be written: the trace is lost, and no summary
  // will arrive for it either.
  REPORT_KIND_REP_NOT_STORED = 2;
  // A rep was detected but its samples were no longer in the ring, so it was
  // dropped before it could be computed. A rep the app will never see.
  REPORT_KIND_REP_WINDOW_UNAVAILABLE = 3;
  // The sampler could not read the IMU: nothing is recorded while this lasts.
  // Reported at most once a second however many reads fail.
  REPORT_KIND_IMU_READ_FAILED = 4;
  // The IMU's stored calibration profile did not apply, or did not persist.
  // Reps are recorded, but the profile the app last saved is not what is
  // running.
  REPORT_KIND_CALIBRATION_PROFILE = 5;
  // The client set the clock and the device kept it in RAM only: this boot's
  // reps are dated, a later boot's log has no record of the epoch.
  REPORT_KIND_CLOCK_NOT_PERSISTED = 6;
  // The pipe gave up on a message the app is waiting for (three attempts, no
  // acknowledgement). The app's own transfer timeout says the same thing a few
  // seconds later.
  REPORT_KIND_TRANSFER_ABANDONED = 7;
  // The app asked for something this device will not serve: a body it does not
  // know, a request it cannot decode, or a trace asked for with nothing
  // subscribed. Always an app firmware-mismatch rather than a device fault.
  REPORT_KIND_REQUEST_REFUSED = 8;
  // A requested trace could not be read back out of the log. The app is
  // waiting on it and will time out.
  REPORT_KIND_TRACE_UNREADABLE = 9;
  // A notification the device tried to send failed on the link.
  REPORT_KIND_NOTIFY_FAILED = 10;
  // The radio's own machinery failed: the HCI runner errored, or advertising
  // could not be started. The device may be invisible or unreachable.
  REPORT_KIND_RADIO_FAILED = 11;
  // The sampler stopped long enough to leave a gap in its timeline. A rep that
  // spans the gap was measured across motion nobody saw, so its travel can read
  // long, and a rep that happened inside the gap was never seen at all.
  REPORT_KIND_SAMPLER_HOLE = 12;
}
